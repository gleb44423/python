<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Заметки с тегами</title><style>
*{box-sizing:border-box;margin:0}body{font:15px/1.5 ui-monospace,Menlo,monospace;background:#fefce8;color:#1c1917;padding:20px;max-width:760px;margin:auto}
h1{margin-bottom:12px}input,textarea{width:100%;padding:10px;border:2px solid #1c1917;background:#fff;font:inherit;margin-bottom:8px}button{padding:8px 14px;border:2px solid #1c1917;background:#facc15;font:inherit;cursor:pointer}
.tg{margin:12px 0}.tg button{background:#fff;margin:0 6px 6px 0;padding:3px 10px}.n{border:2px solid #1c1917;background:#fff;padding:12px;margin-bottom:10px;box-shadow:4px 4px 0 #1c1917}.n em{background:#fde68a;padding:0 6px;font-style:normal}.n button{float:right;padding:0 8px}
</style></head><body><h1>Заметки</h1><input id=q placeholder="Поиск по заметкам" oninput=r()><input id=t placeholder="Заголовок"><textarea id=x rows=3 placeholder="Текст"></textarea><input id=g placeholder="Тег (работа, идеи, учёба…)"><button onclick=a()>Сохранить заметку</button><div class=tg id=tg></div><div id=l></div><script>
var N=JSON.parse(localStorage.n||"[]"),F="";function a(){if(!t.value.trim())return;N.unshift([t.value,x.value,g.value.trim()||"без тега"]);t.value=x.value=g.value='';r()}
function e(s){return s.replace(/</g,'&lt;')}function r(){localStorage.n=JSON.stringify(N);var tags=N.map(function(n){return n[2]}).filter(function(v,i,s){return s.indexOf(v)==i});
tg.innerHTML='<button onclick="F=\'\';r()">все</button>'+tags.map(function(v){return '<button onclick="F=\''+v+'\';r()">'+e(v)+'</button>'}).join('');
l.innerHTML=N.map(function(n,i){return(F&&n[2]!=F)||(n[0]+n[1]).toLowerCase().indexOf(q.value.toLowerCase())<0?'':'<div class=n><button onclick=D('+i+')>✕</button><b>'+e(n[0])+'</b> <em>'+e(n[2])+'</em><p>'+e(n[1])+'</p></div>'}).join('')||'<p>Заметок нет. Добавьте первую выше.</p>'}function D(i){N.splice(i,1);r()}r()</script></body></html>
