<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Клавиши — онлайн-пианино</title><style>
*{box-sizing:border-box;margin:0}body{font:16px system-ui,sans-serif;background:#111827;color:#e5e7eb;text-align:center;padding:30px 10px}
h1{margin-bottom:6px}p{color:#9ca3af;margin-bottom:20px}#k{display:flex;justify-content:center;position:relative;height:200px}
.w{width:48px;height:200px;background:#fff;color:#444;border-radius:0 0 8px 8px;border:1px solid #999;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;user-select:none;cursor:pointer}
.b{width:30px;height:120px;background:#111;margin:0 -15px;z-index:2;border-radius:0 0 5px 5px;color:#aaa;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;cursor:pointer;user-select:none;font-size:12px}
.a{background:#fbbf24!important;color:#000}select{margin-top:20px;padding:8px;font:inherit}
</style></head><body><h1>Клавиши</h1><p>Играйте мышью, пальцем или клавишами A S D F G H J K</p><div id=k></div><select id=w><option>sine</option><option>triangle</option><option>square</option><option>sawtooth</option></select><script>
var N=[["C",261.6,"a",0],["C#",277.2,"w",1],["D",293.7,"s",0],["D#",311.1,"e",1],["E",329.6,"d",0],["F",349.2,"f",0],["F#",370,"t",1],["G",392,"g",0],["G#",415.3,"y",1],["A",440,"h",0],["A#",466.2,"u",1],["B",493.9,"j",0],["C",523.3,"k",0]],X;
k.innerHTML=N.map(function(n,i){return '<div class="'+(n[3]?'b':'w')+'" id=k'+n[2]+' onpointerdown=P('+i+')>'+n[0]+'</div>'}).join('');
function P(i){X=X||new (window.AudioContext||window.webkitAudioContext)();var o=X.createOscillator(),g=X.createGain();o.type=w.value;o.frequency.value=N[i][1];g.gain.setValueAtTime(.3,X.currentTime);g.gain.exponentialRampToValueAtTime(.001,X.currentTime+1.2);o.connect(g);g.connect(X.destination);o.start();o.stop(X.currentTime+1.2);var e=document.getElementById('k'+N[i][2]);e.classList.add('a');setTimeout(function(){e.classList.remove('a')},150)}
addEventListener('keydown',function(e){if(e.repeat)return;N.forEach(function(n,i){if(n[2]==e.key)P(i)})})</script></body></html>
